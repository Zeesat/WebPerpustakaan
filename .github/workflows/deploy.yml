name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest code on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: false
          debug: true
          command_timeout: 10m
          script: |
            whoami
            pwd
            ls -la
            cd /home/u169077025/domains/trpl25.com/public_html/ale-libmanage
            pwd
            git status
            git remote -v
            git pull origin main