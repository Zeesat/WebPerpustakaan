name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check connectivity
        run: |
          echo "Testing connection to SSH server..."
          nc -vz ${{ secrets.HOST }} ${{ secrets.PORT }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          debug: true
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e

            cd /home/u169077025/domains/trpl25.com/public_html/ale-libmanage

            git pull origin main

            git rev-parse HEAD